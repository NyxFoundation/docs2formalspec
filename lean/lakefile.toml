name = "D2fsSpecs"
version = "0.1.0"
defaultTargets = ["D2fsSpecs", "TemplateExamples"]

# Analyzed systems: one module per system under `outputs/<name>/`, symlinked into D2fsSpecs/.
[[lean_lib]]
name = "D2fsSpecs"

# Compiled reference instances for `templates/` — fictional models, no analyzed system.
# Kept out of `D2fsSpecs` so that `lake build D2fsSpecs` compiles exactly the analyzed
# systems and nothing else; still in defaultTargets so `lake build` regression-tests
# the templates.
[[lean_lib]]
name = "TemplateExamples"
